# Local dev only. Prod compose file is a separate, later addition.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - WATCHPACK_POLLING=true
      # Docker Desktop's default network has no working IPv6 route; Neon's host has AAAA
      # records, so without this Node can pick an unreachable IPv6 address and hang, see LEARNING.md
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
